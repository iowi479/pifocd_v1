[General]
network = DumbbellNetwork

sim-time-limit = 10s

**.cmdenv-log-level = info

*.*.eth[*].bitrate = 100Mbps

# SourceApps
*.deviceSource*.numApps = 1
*.deviceSource*.app[0].typename = "UdpSourceApp"

*.deviceSource1.app[0].display-name = "Source1"
*.deviceSource2.app[0].display-name = "Source2"
*.deviceSource3.app[0].display-name = "Source3"
*.deviceSource4.app[0].display-name = "Source4"

*.deviceSource*.app[0].io.destAddress = "deviceSink1"

*.deviceSource1.app[0].io.destPort = 1001
*.deviceSource2.app[0].io.destPort = 1002
*.deviceSource3.app[0].io.destPort = 1003
*.deviceSource4.app[0].io.destPort = 1004

*.deviceSource1.app[0].io.displayStringTextFormat = "{numSent} Stream-(7)-(0)"
*.deviceSource2.app[0].io.displayStringTextFormat = "{numSent} Stream-(6)-(1)"
*.deviceSource3.app[0].io.displayStringTextFormat = "{numSent} Stream-(5)-(2)"
*.deviceSource4.app[0].io.displayStringTextFormat = "{numSent} Stream-(4)-(3)"

*.deviceSource*.app[0].source.packetLength = 1000B - 46B # 1000B overall pkt length incl. headers (8B UDP, 20B IPv4, 18B MAC)

# Together around 88.45 Mbps so about 88.5% linkutilization
*.deviceSource1.app[0].source.productionInterval = truncnormal(400us, 25us)
*.deviceSource2.app[0].source.productionInterval = truncnormal(500us, 25us)
*.deviceSource3.app[0].source.productionInterval = truncnormal(500us, 25us)
*.deviceSource4.app[0].source.productionInterval = truncnormal(600us, 25us)


# SinkApps
*.deviceSink1.numApps = 4
*.deviceSink1.app[*].typename = "UdpSinkApp"

*.deviceSink1.app[0].display-name = "Sink1"
*.deviceSink1.app[1].display-name = "Sink2"
*.deviceSink1.app[2].display-name = "Sink3"
*.deviceSink1.app[3].display-name = "Sink4"

*.deviceSink1.app[0].io.localPort = 1001
*.deviceSink1.app[1].io.localPort = 1002
*.deviceSink1.app[2].io.localPort = 1003
*.deviceSink1.app[3].io.localPort = 1004

*.deviceSink1.app[0].io.displayStringTextFormat = "{numReceived} Stream-(7)-(0)"
*.deviceSink1.app[1].io.displayStringTextFormat = "{numReceived} Stream-(6)-(1)"
*.deviceSink1.app[2].io.displayStringTextFormat = "{numReceived} Stream-(5)-(2)"
*.deviceSink1.app[3].io.displayStringTextFormat = "{numReceived} Stream-(4)-(3)"

# Display number of packets sent and received on network nodes
*.visualizer.infoVisualizer.displayInfos = true
*.visualizer.infoVisualizer.placementHint = "top"
*.visualizer.infoVisualizer.modules = "*.*.app[*].io"
*.visualizer.networkNodeVisualizer.annotationSpacing = 12


# PIFOCD configurations
*.switch1.eth[2].macLayer.queue.typename = "SchedulingTreeQueue"
*.switch2.eth[2].macLayer.queue.typename = "SchedulingTreeQueue"
*.switch3.eth[2].macLayer.queue.typename = "SchedulingTreeQueue"
*.switch4.eth[1].macLayer.queue.typename = "SchedulingTreeQueue"

# Switch between rgp and pmp
# INFO: All time values in us.
*.switch*.eth[*].macLayer.queue.useRgpProtocol = false
*.switch*.eth[*].macLayer.queue.flowCount = 4
*.switch*.eth[*].macLayer.queue.phases = [0, 0, 0, 0]
*.switch*.eth[*].macLayer.queue.periods = [400, 500, 500, 600]

# Accumulated delays at each hop per flow
# Stream-(7 = [pcp])-(0 = [id])
# 80 us transmission delay, 0us propagation delay since length of links is 0
*.switch1.eth[2].macLayer.queue.accumulatedDelays = [80, 80, 0, 0]
*.switch2.eth[2].macLayer.queue.accumulatedDelays = [0, 0, 80, 80]
*.switch3.eth[2].macLayer.queue.accumulatedDelays = [2*80 + 80, 2*80 + 160, 2*80 + 240, 2*80 + 320]
*.switch4.eth[1].macLayer.queue.accumulatedDelays = [3*80 + 80, 3*80 + 160, 3*80 + 240, 3*80 + 320]

# Flow mapping
*.switch*.hasOutgoingStreams = true
*.switch*.bridging.streamIdentifier.identifier.mapping = [
	{stream: "Stream-(7)-(0)", packetFilter: expr(udp.destPort == 1001)}, 
	{stream: "Stream-(6)-(1)", packetFilter: expr(udp.destPort == 1002)},
	{stream: "Stream-(5)-(2)", packetFilter: expr(udp.destPort == 1003)}, 
	{stream: "Stream-(4)-(3)", packetFilter: expr(udp.destPort == 1004)}]

